<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(
      to bottom,
      #ac20cc,
      #ea8dff,
      #f1b1ff
    );
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }
   h1{
          text-align: center;
          color: antiquewhite;
        }
        .navbar {
          background-color: #8716a0;
          border-radius: 10px;
        }
       a[href="clientes.html"],
       a[href="tatuadores.html"],
       a[href="agendamentos.html"],
       a[href="senioridade.html"],
       a[href="estilos.html"],
       a[href="cadastro.html"] {
      background-color: #ac20cc;
      border-color: #ac20cc;
      color: antiquewhite;
      transition: background-color 0.3s ease;
}


a[href="clientes.html"]:hover,
a[href="tatuadores.html"]:hover,
a[href="agendamentos.html"]:hover,
a[href="senioridade.html"]:hover,
a[href="estilos.html"]:hover,
a[href="cadastro.html"]:hover {
  background-color: #8716a0;
  border-color: #8716a0;
  color: antiquewhite;
}

  </style>
</head>
<body>

  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </nav>

  <div class="container">
    <h1 class="mb-4">Painel</h1>
    <div class="row g-3">
      <div class="col-md-4">
        <a href="clientes.html" class="btn btn-primary w-100 py-3">Clientes</a>
      </div>
      <div class="col-md-4">
        <a href="tatuadores.html" class="btn btn-primary w-100 py-3">Tatuadores</a>
      </div>
      <div class="col-md-4">
        <a href="agendamentos.html" class="btn btn-primary w-100 py-3">Agendamentos</a>
      </div>
      <div class="col-md-4">
        <a href="senioridade.html" class="btn btn-secondary w-100 py-3">Senioridade</a>
      </div>
      <div class="col-md-4">
        <a href="estilos.html" class="btn btn-secondary w-100 py-3">Estilos</a>
      </div>
      <div class="col-md-4">
      <a href="cadastro.html" class="btn btn-secondary w-100 py-3">Novo Funcionário</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    protegerPagina()   // o dashboard também é protegido — sem login, não entra
  </script>

</body>
</html>
