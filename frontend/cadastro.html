<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(
      to bottom,
      #ac20cc,
      #ea8dff,
      #f1b1ff
    );
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }
   h1{
          text-align: center;
          color: antiquewhite;
        }
  button.btn-primary{
        background-color: antiquewhite ;
        border: 0px;
        border-radius: 10px;
        color: black ;
        padding: 10px 20px;}

   button.btn-primary:hover {
    background-color: #ac20cc;
    border-color: #ac20cc;
    color: antiquewhite;
  }
  a[href="login.html"] {
  color: #ac20cc;
}

a[href="login.html"]:hover {
  color: #8f1ea9;
}
  </style>
</head>
<body class="container py-5" style="max-width: 480px;">

  <h1 class="mb-4">Criar conta</h1>

  <form id="form-cadastro">
    <div class="mb-3">
      <input type="text" id="nome" class="form-control" placeholder="Nome" required>
    </div>
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail" required>
    </div>
    <div class="mb-3">
      <input type="password" id="senha" class="form-control" placeholder="Senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
  </form>

  <p class="mt-3 text-center">
    Já tem conta? <a href="login.html">Entrar</a>
  </p>
  <script src="js/cadastro.js"></script>

</body>
</html>
