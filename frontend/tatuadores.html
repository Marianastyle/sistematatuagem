<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
      body {
         background: linear-gradient(#ac20cc,#ea8dff, #f1b1ff)
      }
      h1{
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        color: antiquewhite;
      }
        .navbar {
          background-color: #8716a0;
          border-radius: 10px;
        }

        .navbar a {
          text-decoration:none;
          color: antiquewhite;
          transition: color 0.3s ease;
        }

        .table{ 
          background-color: #f1b1ff;
          border-radius: 12px;
          overflow: hidden;
          border-collapse: separate;
        }
        h1{
          text-align: center;
        }
        #btn-submit-tatuador {
          background-color:antiquewhite;
          border-radius:10px;
          border-color: antiquewhite;
          color:black;
          text-align:center;
          margin: 20px auto;
          display: block;
          padding: 10px 20px;
          margin-left: auto;
          margin-right: auto;
        }
                .btn-warning {
        background-color: #727272;
        border-color: #727272;
        color: antiquewhite;
}

      .btn-danger {
      background-color: #ad4bc1;
      border-color: #cb56e2;
      color: antiquewhite;
}

    .btn-warning:hover {
    background-color: #8716a0 ;
    border-color: #8716a0 ;
    color: antiquewhite ;
}
    .btn-danger:hover {
    background-color: #8716a0 ;
    border-color: #8716a0 ;
    color: antiquewhite;
    }
          
  </style>
</head>
<body class="container py-4" >
    <nav class="navbar navbar-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      
    </div>
  </div>
</nav>

  <h1>Tatuadores</h1>

  <!-- Formulário para cadastrar novo tatuador -->
  <form id="form-tatuador" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <input type="text" id="nometatuador" class="form-control" placeholder="Nome" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
    </div>
    <div class="col-md-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail">
    </div>
    <div class="col-md-2">
      <input type="text" id="telefone" class="form-control" placeholder="Telefone">
    </div>
    <div class="col-md-2">
      <select id="idsenioridade" class="form-select" required>
        <option value="">Senioridade...</option>
        <!-- as opções são preenchidas pelo JavaScript -->
      </select>
    </div>
    <div class="col-md-12">
  <label class="form-label">Estilos que domina</label>
  <div id="lista-estilos" class="d-flex flex-wrap gap-3">
    <!-- os checkboxes são preenchidos pelo JavaScript -->
  </div>
</div>
    <div class="col-md-2">
      <button id="btn-submit-tatuador" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde os tatuadores vão aparecer -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Senioridade</th>
        <th>Estilos</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os tatuadores vão aparecer aqui -->
    </tbody>
  </table>
  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
