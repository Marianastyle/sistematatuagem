<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Estilos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(
      to bottom,
      #ac20cc,
      #ea8dff,
      #f1b1ff
    );
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }
      h1{
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        color: antiquewhite;
      }
        .navbar {
          background-color: #8716a0;
          border-radius: 10px;
        }

        .navbar a {
          text-decoration:none;
          color: antiquewhite;
          transition: color 0.3s ease;
        }

        .table{ 
          background-color: #f1b1ff;
          border-radius: 12px;
          overflow: hidden;
          border-collapse: separate;
        }
        h1{
          text-align: center;
        }

        #btn-submit-estilo{
        background-color: antiquewhite ;
        border: 0px;
        border-radius: 10px;
        color: black ;
        padding: 10px 20px;
}
             .btn-warning {
        background-color: #727272;
        border-color: #727272;
        color: antiquewhite;
}

      .btn-danger {
      background-color: #ad4bc1;
      border-color: #cb56e2;
      color: antiquewhite;
}

    .btn-warning:hover {
    background-color: #8716a0 ;
    border-color: #8716a0 ;
    color: antiquewhite ;
}
    .btn-danger:hover {
    background-color: #8716a0 ;
    border-color: #8716a0 ;
    color: antiquewhite;
    }  
          
  </style>
</head>
<body class="container py-4">

  <nav class="navbar navbar-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <div>
        <a href="clientes.html" class="text-light me-3">Clientes</a>
        <a href="senioridade.html" class="text-light me-3">Senioridade</a>
        <a href="estilos.html" class="text-light me-3">Estilos</a>
        <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
        <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
        <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>

  <h1>Estilos</h1>

  <form id="form-estilo" class="row g-2 mt-2 mb-4">
    <div class="col-md-4">
      <input type="text" id="descricao" class="form-control" placeholder="Descrição (ex: Blackwork)" required>
    </div>
    <div class="col-md-2">
      <button id="btn-submit-estilo" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Descrição</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
    </tbody>
  </table>
  <script src="js/auth.js"></script>
  <script src="js/estilos.js"></script>

</body>
</html>
